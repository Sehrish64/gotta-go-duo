<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 400" width="1280" height="400" role="img" aria-label="Gotta Go Duo - a 2-player panic game for Discord">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5865F2"/>
      <stop offset="1" stop-color="#2b2d7e"/>
    </linearGradient>
    <linearGradient id="meter" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3ddc84"/>
      <stop offset="0.55" stop-color="#ffd23f"/>
      <stop offset="1" stop-color="#ff4d4d"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="400" rx="28" fill="url(#bg)"/>

  <!-- floor tiles -->
  <g opacity="0.12" fill="#fff">
    <rect x="0" y="330" width="1280" height="70"/>
  </g>
  <g stroke="#fff" stroke-opacity="0.15" stroke-width="2">
    <line x1="160" y1="330" x2="160" y2="400"/><line x1="320" y1="330" x2="320" y2="400"/>
    <line x1="480" y1="330" x2="480" y2="400"/><line x1="640" y1="330" x2="640" y2="400"/>
    <line x1="800" y1="330" x2="800" y2="400"/><line x1="960" y1="330" x2="960" y2="400"/>
    <line x1="1120" y1="330" x2="1120" y2="400"/>
  </g>

  <!-- title -->
  <text x="640" y="150" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif"
        font-size="96" font-weight="900" fill="#ffffff" letter-spacing="3">GOTTA GO DUO</text>
  <text x="640" y="205" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif"
        font-size="30" fill="#e7e9ff">A 2-player panic game for Discord</text>

  <!-- panic meter -->
  <rect x="390" y="235" width="500" height="26" rx="13" fill="#ffffff" fill-opacity="0.2"/>
  <rect x="390" y="235" width="380" height="26" rx="13" fill="url(#meter)"/>
  <text x="640" y="285" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif"
        font-size="20" font-weight="700" fill="#ffffff">PANIC 76%</text>

  <!-- duck (left) -->
  <g transform="translate(170 270)">
    <ellipse cx="0" cy="40" rx="62" ry="50" fill="#ffd23f"/>
    <circle cx="0" cy="-30" r="42" fill="#ffd23f"/>
    <path d="M-12 -52 q12 -22 26 0 z" fill="#2b2d7e"/>
    <rect x="-34" y="-62" width="68" height="14" rx="5" fill="#ffffff"/>
    <circle cx="-14" cy="-28" r="6" fill="#222"/><circle cx="14" cy="-28" r="6" fill="#222"/>
    <ellipse cx="0" cy="-10" rx="22" ry="11" fill="#ff8c1a"/>
  </g>

  <!-- mango (right) -->
  <g transform="translate(1110 270)">
    <ellipse cx="0" cy="25" rx="58" ry="72" fill="#ffa931"/>
    <path d="M0 -42 q-8 -28 22 -34 q4 22 -22 34 z" fill="#3ddc84"/>
    <rect x="-38" y="0" width="30" height="20" rx="8" fill="#111"/>
    <rect x="8" y="0" width="30" height="20" rx="8" fill="#111"/>
    <rect x="-10" y="6" width="20" height="5" fill="#111"/>
    <path d="M-22 48 q22 20 44 0" stroke="#7a3b00" stroke-width="5" fill="none" stroke-linecap="round"/>
    <path d="M44 -10 q8 14 0 24 q-8 -10 0 -24z" fill="#7fd6ff"/>
  </g>

  <!-- WC door -->
  <g transform="translate(640 330)">
    <rect x="-34" y="-12" width="68" height="46" rx="8" fill="#ffffff"/>
    <text x="0" y="22" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif"
          font-size="28" font-weight="900" fill="#2b2d7e">WC</text>
  </g>
</svg>
